{% extends "base.html" %}

{% block title %}Sign In — TravelGo{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-header">
    <div style="font-size: 2rem; margin-bottom: 0.25rem;">🔐</div>
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Sign in to manage your bookings and view e-tickets</p>
  </div>

  <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST">
    <div class="form-group" style="margin-bottom: 1.25rem;">
      <label class="form-label">Email Address</label>
      <input type="email" name="email" value="{{ email or '' }}" class="form-control" placeholder="name@example.com" required autofocus>
    </div>

    <div class="form-group" style="margin-bottom: 1.5rem;">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn btn-primary btn-block" style="padding: 0.75rem;">
      Sign In
    </button>
  </form>

  <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--gray-600);">
    Don't have an account? <a href="{{ url_for('auth.register') }}" style="font-weight: 700;">Create one now</a>
  </div>
</div>
{% endblock %}
