{% extends "base.html" %}

{% block title %}Create Account — TravelGo{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-header">
    <div style="font-size: 2rem; margin-bottom: 0.25rem;">✨</div>
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-subtitle">Register to reserve buses, trains, flights & hotels</p>
  </div>

  <form action="{{ url_for('auth.register') }}" method="POST">
    <div class="form-group" style="margin-bottom: 1.25rem;">
      <label class="form-label">Full Name</label>
      <input type="text" name="name" value="{{ name or '' }}" class="form-control" placeholder="e.g. John Doe" required autofocus>
    </div>

    <div class="form-group" style="margin-bottom: 1.25rem;">
      <label class="form-label">Email Address (Unique Identifier / PK)</label>
      <input type="email" name="email" value="{{ email or '' }}" class="form-control" placeholder="name@example.com" required>
    </div>

    <div class="form-group" style="margin-bottom: 1.25rem;">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" placeholder="At least 6 characters" required>
    </div>

    <div class="form-group" style="margin-bottom: 1.5rem;">
      <label class="form-label">Confirm Password</label>
      <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
    </div>

    <button type="submit" class="btn btn-primary btn-block" style="padding: 0.75rem;">
      Register Account
    </button>
  </form>

  <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--gray-600);">
    Already have an account? <a href="{{ url_for('auth.login') }}" style="font-weight: 700;">Sign in</a>
  </div>
</div>
{% endblock %}
